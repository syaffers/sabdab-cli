[project]
name = "sabdab-cli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Syafiq Kamarul Azman", email = "syafiqkamarulazman@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.20.0",
    "rich>=14.2.0",
    "httpx>=0.28.1",
    "tenacity>=9.1.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.4.0",
    "pyrefly>=0.40.1",
    "pytest-asyncio>=1.2.0",
    "pytest>=8.4.2",
    "ruff>=0.14.4",
]

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
sabdab = "sabdab_cli.cli:app"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["sabdab_cli", "conftest"]

[tool.ruff.lint.per-file-ignores]
"sabdab_downloader.py" = ["ALL"]  # Legacy script, not refactoring yet

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
]
